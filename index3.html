<!DOCTYPE html> 
<html lang="en">

	<head>

		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Форма с валидацией</title>
		<style>

			.error {
				color: red;
				font-size: 0.9em;
			}

			/* Стили для поля с ошибкой */
			.input-error {
				border: 2px solid red;
			}

		</style>

		<!-- Подключение библиотеки IMask -->
		<script src="https://unpkg.com/imask"></script>

	</head>

	<body>

		<form id="subscribeForm" action="/#subscribe" method="post">

			<label for="name">Ваше имя:</label><br />
			<input
				type="text"
				id="name"
				name="name"
				placeholder="Екатерина"
				required
			/>
			<div id="nameError" class="error"></div>
			<br />

			<label for="whatsapp">Whatsapp номер:</label><br />
			<input
				type="tel"
				id="whatsapp"
				name="whatsapp"
				placeholder="+7 (____) ___-__-__"
				required
			/>
			<div id="whatsappError" class="error"></div>
			<br />

			<button type="submit" id="submitButton">Оставить заявку</button>

		</form>

		<script>

			// Инициализация маски с помощью IMask
			const whatsappInput = document.getElementById("whatsapp");
			const whatsappMask = IMask(whatsappInput, {
				mask: "+7 (000) 000-00-00",
				lazy: false, // чтобы отображались символы маски, даже если поле пустое
			});

			// Валидация
			const nameInput = document.getElementById("name");
			const nameError = document.getElementById("nameError");
			const whatsappError = document.getElementById("whatsappError");
			const submitButton = document.getElementById("submitButton");

			let isFirstSubmit = false;  // Флаг, который отслеживает, был ли первый клик

			// Проверка формы для активации кнопки
			function validateForm() {

				const name = nameInput.value.trim();
				const whatsapp = whatsappMask.unmaskedValue; // Получение только цифр из маски

				let isValid = true;

				// Проверка имени
				if (!name) {
					nameError.textContent = "Пожалуйста, заполните это поле.";
					nameInput.classList.add("input-error");
					isValid = false;
				} else if (!/^([а-яА-ЯёЁ\s]+)$/.test(name)) {
					nameError.textContent = "Имя должно содержать только русские буквы.";
					nameInput.classList.add("input-error");
					isValid = false;
				} else {
					nameError.textContent = "";
					nameInput.classList.remove("input-error");
				}

				// Проверка телефона
				if (!whatsapp || whatsapp.length < 10) {
					whatsappError.textContent = "Введите корректный номер телефона.";
					whatsappInput.classList.add("input-error");
					isValid = false;
				} else {
					whatsappError.textContent = "";
					whatsappInput.classList.remove("input-error");
				}

				// Управление кнопкой отправки
				submitButton.disabled = !isValid;
			}

			// Обработчик нажатия на кнопку
			submitButton.addEventListener("click", function(event) {
				event.preventDefault(); // Останавливаем отправку формы
				isFirstSubmit = true;  // После первого нажатия разрешаем валидацию

				validateForm(); // Запускаем валидацию
			});

			// Обработчик ввода после первого клика
			nameInput.addEventListener("input", function() {
				if (isFirstSubmit) {
					validateForm(); // Запускаем валидацию после первого клика
				}
			});

			whatsappInput.addEventListener("input", function() {
				if (isFirstSubmit) {
					validateForm(); // Запускаем валидацию после первого клика
				}
			});

		</script>

	</body>

</html>

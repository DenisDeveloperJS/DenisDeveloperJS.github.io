<!DOCTYPE html>

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Meine Projekte</title>
		<style>
			/* Общие стили */
			body {
				font-family: "Arial", sans-serif;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				background: linear-gradient(135deg, #4facfe, #00f2fe);
				color: #fff;
				text-align: center;
			}

			.container {
				background: rgba(255, 255, 255, 0.1);
				padding: 40px;
				border-radius: 20px;
				backdrop-filter: blur(10px);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
				animation: fadeIn 1.5s ease-in-out;
				width: 90%;
				max-width: 600px;
			}

			h1 {
				font-size: 36px;
				margin-bottom: 20px;
				animation: slideDown 1s ease-in-out;
			}

			.links {
				display: flex;
				flex-direction: column;
				gap: 15px;
			}

			.link {
				display: flex;
				justify-content: space-between;
				align-items: center;
				background: rgba(255, 255, 255, 0.2);
				padding: 12px 20px;
				border-radius: 8px;
				text-decoration: none;
				color: #fff;
				font-size: 18px;
				font-weight: bold;
				position: relative;
				overflow: hidden;
			}

			.link::before {
				content: "";
				position: absolute;
				top: 0;
				left: -100%;
				width: 100%;
				height: 100%;
				background: rgba(255, 255, 255, 0.3);
				transition: left 0.4s ease-in-out;
			}

			.link:hover::before {
				left: 0;
			}

			.info {
				font-size: 14px;
				opacity: 0.8;
				padding: 2px 6px;
				border-radius: 5px;
				white-space: nowrap;
			}

			.frontend {
				background-color: #ffcc00;
				color: #000;
			}

			.fullstack {
				background-color: #00cc66;
				color: #fff;
			}

			.footer {
				margin-top: 20px;
				padding: 15px;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 10px;
			}

			.footer p {
				margin: 0;
				font-size: 20px;
				font-weight: bold;
			}

			.social-links {
				display: flex;
				gap: 15px;
				justify-content: center;
				align-items: center;

				margin-top: 20px;
			}

			.social-links a {
				display: inline-block;
			}

			.social-links img {
				width: 30px;
				height: 30px;
				transition: transform 0.3s ease-in-out;
			}

			.social-links img:hover {
				transform: scale(1.2);
			}

			/* Адаптивные стили */
			@media (max-width: 768px) {
				.container {
					width: 95%;
					padding: 30px;
				}

				h1 {
					font-size: 28px;
				}

				.info {
					margin-top: 5px;
				}
			}

			@media (max-width: 480px) {
				.container {
					width: 100%;
					min-height: 100vh;
					border-radius: 0;
					padding: 20px;
					display: flex;
					flex-direction: column;
					justify-content: center;
				}

				h1 {
					font-size: 24px;
				}

				.link {
					font-size: 16px;
					padding: 10px;
					display: flex;
					flex-wrap: wrap;
					gap: 15px;
				}
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(-20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@keyframes slideDown {
				from {
					opacity: 0;
					transform: translateY(-50px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>
	</head>

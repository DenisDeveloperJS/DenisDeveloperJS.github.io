<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Meine Projekte</title>
		<style>
			/* Общие стили */
			body {
				font-family: "Arial", sans-serif;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				background: linear-gradient(135deg, #6e8efb, #a777e3);
				color: #fff;
				text-align: center;
				overflow: hidden;
			}

			.container {
				background: rgba(255, 255, 255, 0.1);
				padding: 30px;
				border-radius: 15px;
				backdrop-filter: blur(10px);
				box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
				animation: fadeIn 1.5s ease-in-out;
			}

			h1 {
				font-size: 32px;
				margin-bottom: 20px;
				animation: slideDown 1s ease-in-out;
			}

			.links {
				display: flex;
				flex-direction: column;
				gap: 15px;
			}

			.link {
				display: block;
				background: rgba(255, 255, 255, 0.2);
				padding: 12px 20px;
				border-radius: 8px;
				text-decoration: none;
				color: #fff;
				font-size: 18px;
				font-weight: bold;
				transition: all 0.3s ease-in-out;
				position: relative;
				overflow: hidden;
			}

			.link:hover {
				background: rgba(255, 255, 255, 0.4);
				transform: scale(1.05);
			}

			.link::before {
				content: "";
				position: absolute;
				top: 0;
				left: -100%;
				width: 100%;
				height: 100%;
				background: rgba(255, 255, 255, 0.3);
				transition: left 0.4s ease-in-out;
			}

			.link:hover::before {
				left: 0;
			}

			/* Анимации */
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(-20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@keyframes slideDown {
				from {
					opacity: 0;
					transform: translateY(-50px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Meine Projekte</h1>
			<div class="links">
				<a href="https://denisdeveloperjs.github.io/cleaning-crm/" class="link"
					>🧼 Cleaning CRM</a
				>
				<a href="https://denisdeveloperjs.github.io/project-2/" class="link"
					>🌍 Projekt 2</a
				>
				<a href="https://denisdeveloperjs.github.io/project-3/" class="link"
					>📊 Projekt 3</a
				>
				<a href="https://denisdeveloperjs.github.io/project-4/" class="link"
					>🛒 Projekt 4</a
				>
			</div>
		</div>
	</body>
</html>
